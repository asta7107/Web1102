<!DOCTYPE html>
<meta charset="utf-8">
<html>
 <head>
    <title>리스트에서 자료 선택하기</title>
     <script>
        function drawImage() {
            let f = document.getElementById("fruit");
            let fimg = document.getElementById("fimg");
            fimg.src = f.options[f.selectedIndex].value;
        }
        function lunchImage() {
            let l = document.getElementById("lunch");
            let limg = document.getElementById("limg");
            limg.src = l.options[l.selectedIndex].value;
        }
        function tripImage() {
            let t = document.getElementById("trip");
            let timg = document.getElementById("timg");
            timg.src = t.options[t.selectedIndex].value;
        }
     </script>
 </head>
    <body>
        주제 1 내가 좋아하는 과일 선택 <br>
        <form>
            <select id="fruit" onchange="drawImage()" >
                <option value="딸기.png">딸기</option>
                <option value="레몬.png">레몬</option>
                <option value="망고.png">망고</option>
                </select>
                <img id="fimg" src="레몬.png" alt="설명문" width="100" height="100">
        </form>
         주제 2 오늘 점심선택 - 유사하게 작성 메뉴는 다섯개  <br>
         <form>
            <select id = "lunch" onchange="lunchImage()">
                <option value="kim.jpg">김치찌개</option>
                <option value="bim.jpg">비빔밥</option>
                <option value="ja.jpg">짜장면</option>
                <option value="jjam.jpg">짬뽕</option>
                <option value="tanf.jpg">탕수육</option>
            </select>
             <img id="limg" src="kim.jpg" alt="설명문" width="100" height="100">
        </form>
        주제 3 여행지 확인
         <form>
            <select id = "trip" onchange="tripImage()">
                <option value="trip1.jpg">여행지1</option>
                <option value="trip2.jpg">여행지2</option>
                <option value="trip3.jpg">여행지3</option>
                <option value="trip4.jpg">여행지4</option>
               
            </select>
             <img id="timg" src="trip1.jpg" alt="설명문" width="100" height="100">
        </form>

    </body>
</html>
